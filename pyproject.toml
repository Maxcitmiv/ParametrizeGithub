[project]
name = "paramertizegithub"
version = "0.1.0"
description = "UI parametrize autotests for GitHub"
authors = [
    {name = "Maxcitmiv"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "selene (==2.0.0rc9)",
    "pytest (==9.0.2)",
    "allure-pytest (==2.15.3)",
    "selenium (==4.35.0)"
]

[dependency-groups]
dev = [
    "pylint (>=4.0.5,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
